<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <style>
      @media (max-width: 768px) {
        .footer {
          display: none;
        }
      }

      /* 스켈레톤 로딩 스타일 */
      .skeleton-content {
        animation: skeleton-fade-in 0.3s ease-in-out;
      }

      @keyframes skeleton-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes skeleton-shimmer {
        0% {
          background-position: -200px 0;
        }
        100% {
          background-position: calc(200px + 100%) 0;
        }
      }

      .skeleton-text, .skeleton-image, .skeleton-card {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200px 100%;
        animation: skeleton-shimmer 1.5s infinite;
        border-radius: 4px;
      }

      .skeleton-card {
        height: 300px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .skeleton-card-thumbnail {
        width: 100%;
        height: 180px;
        margin-bottom: 16px;
      }

      .skeleton-card-title {
        width: 90%;
        height: 20px;
        margin-bottom: 12px;
      }

      .skeleton-card-summary {
        width: 100%;
        height: 16px;
        margin-bottom: 8px;
      }

      .skeleton-card-summary.short {
        width: 70%;
      }

      .skeleton-card-tags {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .skeleton-tag {
        width: 60px;
        height: 24px;
        border-radius: 12px;
      }

      .skeleton-card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .skeleton-card-meta {
        display: flex;
        gap: 12px;
      }

      .skeleton-source {
        width: 60px;
        height: 14px;
      }

      .skeleton-date {
        width: 80px;
        height: 14px;
      }

      .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      /* 점진적 로딩 애니메이션 */
      .progressive-fade-in {
        animation: progressive-fade-in 0.5s ease-in-out;
      }

      @keyframes progressive-fade-in {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 스켈레톤 카드별 지연 애니메이션 */
      .skeleton-card:nth-child(1) { animation-delay: 0.1s; }
      .skeleton-card:nth-child(2) { animation-delay: 0.2s; }
      .skeleton-card:nth-child(3) { animation-delay: 0.3s; }
      .skeleton-card:nth-child(4) { animation-delay: 0.4s; }
      .skeleton-card:nth-child(5) { animation-delay: 0.5s; }
      .skeleton-card:nth-child(6) { animation-delay: 0.6s; }
      .skeleton-card:nth-child(7) { animation-delay: 0.7s; }
      .skeleton-card:nth-child(8) { animation-delay: 0.8s; }
      .skeleton-card:nth-child(9) { animation-delay: 0.9s; }
      .skeleton-card:nth-child(10) { animation-delay: 1.0s; }
      .skeleton-card:nth-child(11) { animation-delay: 1.1s; }
      .skeleton-card:nth-child(12) { animation-delay: 1.2s; }
    </style>

        <!-- 에러 상태 -->

        <!-- 빈 상태 -->

            <svg

              <path

    <script src="nutrition-info.js"></script>
    <script>
      // 인증 링크 업데이트 함수
      async function updateAuthLinks() {
        const authLinksContainer = document.querySelector(".auth-links");
        try {
          const response = await fetch("/api/auth/me", {
            credentials: "include",
          });
          const data = await response.json();

          if (data.loggedIn) {
            authLinksContainer.innerHTML = `
                        <a href="mypage.html">마이페이지</a>
                        <a href="#" onclick="logout()">로그아웃</a>
                    `;
          } else {
            authLinksContainer.innerHTML = `
                        <a href="login.html">로그인</a>
                        <a href="signup.html">회원가입</a>
                    `;
          }
        } catch (error) {
          console.error("인증 상태 확인 오류:", error);
          authLinksContainer.innerHTML = `
                    <a href="login.html">로그인</a>
                    <a href="signup.html">회원가입</a>
                `;
        }
      }

      // 로그아웃 함수
      async function logout() {
        try {
          const response = await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include",
          });

          if (response.ok) {
            localStorage.removeItem("user");
            alert("로그아웃되었습니다.");
            window.location.href = "index.html";
          } else {
            alert("로그아웃 중 오류가 발생했습니다.");
          }
        } catch (error) {
          console.error("로그아웃 오류:", error);
          alert("로그아웃 중 오류가 발생했습니다.");
        }
      }

      // 페이지 로드 시 인증 링크 업데이트
      document.addEventListener("DOMContentLoaded", async function () {
        await updateAuthLinks();

        // footer-nav 활성 상태 설정
        const footerNavNutrition = document.getElementById("footerNavNutrition");
        if (footerNavNutrition) {
          footerNavNutrition.classList.add("active");
        }

        // AI 기능 모달 처리
        const aiFeatureBtn = document.querySelector(".footer-nav-ai-btn");
        const aiFeatureModal = document.getElementById("aiFeatureModal");

        if (aiFeatureBtn && aiFeatureModal) {
          aiFeatureBtn.addEventListener("click", function (e) {
            e.preventDefault();
            aiFeatureModal.classList.toggle("active");
          });

          // 모달 외부 클릭 시 닫기
          document.addEventListener("click", function (e) {
            if (
              !aiFeatureBtn.contains(e.target) &&
              !aiFeatureModal.contains(e.target)
            ) {
              aiFeatureModal.classList.remove("active");
            }
          });
        }
      });
    </script>
