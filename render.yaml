# Render 배포 설정 파일
services:
  - type: web
    name: meal-plan-nutrition
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_RESPONSES_MODEL
        value: gpt-6-luna
      # 아래 환경변수들은 Render 대시보드에서 직접 설정해야 합니다
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_KEY
      #   sync: false
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: KAKAO_REST_API_KEY
      #   sync: false
      # - key: NAVER_CLIENT_ID
      #   sync: false
      # - key: NAVER_CLIENT_SECRET
      #   sync: false
